<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Check Latte Wiki</title><style>:root{--bg:#2c2420;--card:#3e332e;--accent:#d2b48c;--text:#f5f5dc;--white:#ffffff}body{background-color:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;margin:0;padding:20px}.header{text-align:center;margin-bottom:30px}.search-bar{width:100%;max-width:600px;padding:12px;border-radius:25px;border:none;margin:10px auto;display:block;background:var(--card);color:var(--white)}.filters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}select{padding:8px;border-radius:5px;background:var(--card);color:var(--white);border:1px solid var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;max-width:1200px;margin:auto}.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform 0.3s}.card:hover{transform:scale(1.05)}.card img{width:100%;height:150px;object-fit:cover}.card-content{padding:15px}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center}.modal-content{background:var(--bg);padding:30px;border-radius:15px;max-width:500px;width:90%;border:2px solid var(--accent)}</style></head><body><div class="header"><h1>Check Latte Wiki</h1><input type="text" id="search" class="search-bar" placeholder="Buscar jogos..."><div class="filters"><select id="catFilter"><option value="">Gênero</option><option value="Estratégia">Estratégia</option><option value="Social">Social</option></select></div></div><div class="grid" id="gameGrid"></div><div id="modal" class="modal"><div class="modal-content" id="modalBody"></div></div><script>const games=[{id:1,title:"Catan",cat:"Estratégia",time:"60-90min",diff:"Médio",rules:"Colete recursos e construa estradas."},{id:2,title:"Dixit",cat:"Social",time:"30min",diff:"Fácil",rules:"Use cartas ilustradas para contar histórias."},{id:3,title:"Coup",cat:"Social",time:"15min",diff:"Fácil",rules:"Blufe para eliminar seus oponentes."}];const grid=document.getElementById('gameGrid');const search=document.getElementById('search');function render(data){grid.innerHTML='';data.forEach(g=>{const div=document.createElement('div');div.className='card';div.innerHTML=`<div class="card-content"><h3>${g.title}</h3><p>${g.cat}</p></div>`;div.onclick=()=>showModal(g);grid.appendChild(div);});}function showModal(g){const m=document.getElementById('modal');document.getElementById('modalBody').innerHTML=`<h2>${g.title}</h2><p><strong>Dificuldade:</strong> ${g.diff}</p><p><strong>Tempo:</strong> ${g.time}</p><p>${g.rules}</p><button onclick="document.getElementById('modal').style.display='none'">Fechar</button>`;m.style.display='flex';}search.oninput=(e)=>{const val=e.target.value.toLowerCase();render(games.filter(g=>g.title.toLowerCase().includes(val)));};render(games);</script></body></html>
